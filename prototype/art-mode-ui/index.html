<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE – Domindle Art Mode UI (throwaway)</title>
<!--
  PROTOTYPE, THROWAWAY. Question: "what should Art Mode look and feel like?"
  Three structurally different layouts on one page, switch with ← / → or the bottom bar (?variant=A|B|C).
    A  Parchment: Dominion-flavoured single column, card-frame styling
    B  Clean: loldle-style dark minimal, stats in a modal
    C  Split: wide two-pane, image left, guesses + zoom ladder + stats always visible
  Zoom steps / easing are tunable in the bar (?steps=7&ease=geo). Everything in memory; stats and "yesterday" are fake.
  Open by double-click (art/ is next to this file).
-->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif}
#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:99;background:#111;color:#fff;border-radius:99px;padding:6px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 20px #0008;font:13px system-ui;flex-wrap:wrap;justify-content:center;max-width:96vw}
#bar button,#bar select{background:#333;color:#fff;border:0;border-radius:99px;padding:5px 11px;font:inherit;cursor:pointer}
#bar b{min-width:150px;text-align:center}
.frame{position:relative;overflow:hidden;aspect-ratio:4/3;background:#222}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1);will-change:transform}
.sugg{position:absolute;left:0;right:0;z-index:5;max-height:220px;overflow:auto}
.sugg div{padding:8px 12px;cursor:pointer}
.row{display:flex;gap:8px;position:relative}
input{font:inherit;min-width:0}
.wrong{display:block}
.tools{padding-bottom:70px}
/* ---------- A parchment ---------- */
.A{background:#d9c59a radial-gradient(circle at 50% 0,#ecdcb4,#cdb887);min-height:100vh;color:#3a2a14;font-family:Georgia,serif;padding:20px 14px 90px}
.A .wrap{max-width:560px;margin:auto}
.A h1{font-variant:small-caps;text-align:center;letter-spacing:.08em;margin:6px 0;font-size:34px}
.A .sub{text-align:center;font-style:italic;margin-bottom:14px;opacity:.8}
.A .card{background:#f4e9cc;border:6px double #7a5a2a;border-radius:14px;padding:12px;box-shadow:0 6px 18px #0004}
.A .frame{border:3px solid #5a4020;border-radius:6px}
.A .banner{background:#b9372b;color:#fff;text-align:center;padding:6px;border-radius:30px;margin:10px 20px 0;font-variant:small-caps;letter-spacing:.1em}
.A input{flex:1;padding:11px;border:2px solid #7a5a2a;border-radius:8px;background:#fffaf0}
.A .btn{background:#7a5a2a;color:#fff;border:0;border-radius:8px;padding:0 16px;cursor:pointer;font:inherit}
.A .sugg{top:100%;background:#fffaf0;border:2px solid #7a5a2a;border-radius:8px;margin-top:2px}
.A .sugg div:hover,.A .sugg .hl{background:#ead9aa}
.A .wrong{background:#c0392b;color:#fff;padding:8px 12px;border-radius:8px;margin-top:6px}
.A .meta{display:flex;justify-content:space-between;margin:14px 4px 0;font-size:14px}
.A .stat{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:14px 0}
.A .stat b{display:block;font-size:26px}
.A .hist div{display:flex;gap:6px;align-items:center;font-size:13px}
.A .hist i{background:#7a5a2a;height:14px;display:block;border-radius:3px;min-width:4px}
.A .hist i.me{background:#2e7d32}
/* ---------- B clean dark ---------- */
.B{background:#121317;color:#e8e9ee;min-height:100vh;font-family:system-ui,sans-serif;padding:16px 14px 90px}
.B .wrap{max-width:460px;margin:auto}
.B header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2c35;padding-bottom:10px;margin-bottom:14px}
.B h1{font-size:20px;margin:0;letter-spacing:.02em}
.B .ic{background:none;border:1px solid #333;color:#ccc;border-radius:8px;padding:5px 10px;cursor:pointer}
.B .frame{border-radius:14px}
.B input{flex:1;padding:13px;border-radius:10px;border:1px solid #333;background:#1c1e26;color:#fff}
.B .btn{background:#4f8cff;color:#fff;border:0;border-radius:10px;padding:0 18px;cursor:pointer;font:inherit}
.B .sugg{top:100%;background:#1c1e26;border:1px solid #333;border-radius:10px;margin-top:4px}
.B .sugg div:hover,.B .sugg .hl{background:#2b2f3b}
.B .wrong{background:#3a1519;border:1px solid #c0392b;color:#ffb3ab;padding:10px 12px;border-radius:10px;margin-top:6px}
.B .dots{display:flex;gap:4px;margin:10px 0}
.B .dots i{flex:1;height:5px;border-radius:3px;background:#2a2c35}
.B .dots i.on{background:#c0392b}
.B .foot{margin-top:18px;font-size:13px;color:#9aa0b0;text-align:center;line-height:1.7}
.B .modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.B .modal>div{background:#181a21;border:1px solid #333;border-radius:14px;padding:18px;max-width:420px;width:100%}
.B .stat{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:10px 0}
.B .stat b{display:block;font-size:24px}
.B .hist div{display:flex;gap:6px;align-items:center;font-size:12px;margin:2px 0}
.B .hist i{background:#4f8cff;height:14px;display:block;border-radius:3px;min-width:4px}
.B .hist i.me{background:#3ecf6e}
/* ---------- C split ---------- */
.C{background:#f3f1ec;color:#222;min-height:100vh;font-family:system-ui,sans-serif;padding:14px 14px 90px}
.C .grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;max-width:1100px;margin:auto}
@media(max-width:800px){.C .grid{grid-template-columns:1fr}}
.C h1{margin:0 0 10px;font-size:22px}
.C .frame{border-radius:4px;box-shadow:0 8px 30px #0003}
.C .panel{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
.C input{flex:1;padding:11px;border:2px solid #222;border-radius:4px}
.C .btn{background:#222;color:#fff;border:0;border-radius:4px;padding:0 16px;cursor:pointer;font:inherit}
.C .sugg{top:100%;background:#fff;border:2px solid #222;margin-top:2px}
.C .sugg div:hover,.C .sugg .hl{background:#eee}
.C .wrong{background:#e0463a;color:#fff;padding:7px 10px;border-radius:4px;margin-top:5px;display:flex;justify-content:space-between}
.C .ladder{display:flex;align-items:flex-end;gap:3px;height:34px}
.C .ladder i{flex:1;background:#ddd;border-radius:2px}
.C .ladder i.on{background:#e0463a}
.C .stat{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.C .stat b{display:block;font-size:22px}
.C .hist div{display:flex;gap:6px;align-items:center;font-size:12px;margin:2px 0}
.C .hist i{background:#222;height:12px;display:block;min-width:4px}
.C .hist i.me{background:#2e9e4f}
.C small{color:#777}
.win{margin-top:10px;text-align:center}
.win h2{margin:6px 0}

/* ---- A-family shared extras ---- */
.P header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.P h1{margin:0!important;text-align:left!important}
.P h1 small{font-size:.5em;opacity:.6;letter-spacing:.1em;font-weight:400}
.P .ic{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit;font-size:14px;opacity:.85}
.P .meta{justify-content:center;text-align:center}
.P .modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.P .modal>div{background:#f4e9cc;color:#3a2a14;border:4px double #7a5a2a;border-radius:14px;padding:18px;max-width:420px;width:100%}
.P .stat{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:10px 0}
.P .stat b{display:block;font-size:24px}
.P .hist div{display:flex;gap:6px;align-items:center;font-size:12px;margin:2px 0}
.P .hist i{background:#7a5a2a;height:14px;display:block;border-radius:3px;min-width:4px}
.P .hist i.me{background:#2e7d32}
/* ---------- D flat paper ---------- */
.D{background:#f6f1e4;color:#2b2418;min-height:100vh;font-family:system-ui,sans-serif;padding:16px 14px 90px}
.D .wrap{max-width:520px;margin:auto}
.D h1{font-family:Georgia,serif;font-size:26px}
.D .card{background:#fff;border:1px solid #d8cfb8;border-radius:10px;padding:10px}
.D .frame{border-radius:6px}
.D .banner{color:#8a3a2a;font-weight:600;padding:8px 2px 0}
.D input{flex:1;padding:11px;border:1px solid #bfb394;border-radius:8px;background:#fffdf7}
.D .btn{background:#8a3a2a;color:#fff;border:0;border-radius:8px;padding:0 16px;cursor:pointer;font:inherit}
.D .sugg{top:100%;background:#fff;border:1px solid #bfb394;border-radius:8px;margin-top:2px}
.D .sugg div:hover,.D .sugg .hl{background:#f1e8d0}
.D .wrong{background:#fdecea;color:#b3261e;border:1px solid #f1b8b2;padding:8px 12px;border-radius:8px;margin-top:6px}
.D .meta{margin-top:14px;font-size:13px;color:#6b5f48}
/* ---------- E card frame on dark table ---------- */
.E{background:#1d2a24 radial-gradient(circle at 50% 30%,#2d4237,#141c18);color:#e9e2cf;min-height:100vh;font-family:Georgia,serif;padding:16px 14px 90px}
.E .wrap{max-width:500px;margin:auto}
.E h1{font-variant:small-caps;letter-spacing:.1em;font-size:26px}
.E .card{background:#e9dcb8;color:#2e2412;border:10px solid #17120a;border-radius:18px;padding:8px 10px 12px;box-shadow:0 10px 30px #000a}
.E .frame{border:2px solid #17120a}
.E .banner{background:#f7efd5;border:2px solid #17120a;border-radius:6px;margin:-14px 14px 6px;position:relative;z-index:2;text-align:center;padding:5px;font-weight:700;font-variant:small-caps;letter-spacing:.06em}
.E input{flex:1;padding:11px;border:2px solid #17120a;border-radius:6px;background:#f7efd5}
.E .btn{background:#17120a;color:#e9dcb8;border:0;border-radius:6px;padding:0 16px;cursor:pointer;font:inherit}
.E .sugg{top:100%;background:#f7efd5;color:#2e2412;border:2px solid #17120a;margin-top:2px}
.E .sugg div:hover,.E .sugg .hl{background:#e3d3a3}
.E .wrong{background:#a52a20;color:#fff;padding:7px 12px;border-radius:6px;margin-top:6px}
.E .meta{margin-top:16px;font-size:13px;opacity:.8}
.E .win{color:#2e2412}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar"></div>

<script>
/* ===================== fake data ===================== */
const CARDS = [
 ['Village','Village'],['Smithy','Smithy'],['Witch','Witch'],['Moat','Moat'],['Market','Market'],['Cellar','Cellar'],
 ['Militia','Militia'],['Festival','Festival'],['Gardens','Gardens'],['Laboratory','Laboratory'],['Chapel','Chapel'],
 ['Throne Room','Throne_Room'],['Bureaucrat','Bureaucrat'],['Mine','Mine'],['Library','Library'],['Sentry','Sentry'],
 ['Hovel','Hovel'],['Café','Cafe'] // no art for these two: just extra autocomplete noise
].map(([name,f])=>({name,src:`art/${f}Art.jpg`,hasArt:!['Hovel','Café'].includes(name)}));
const ARTCARDS = CARDS.filter(c=>c.hasArt);
const FAKE_STATS = {played:23,streak:4,best:9,hist:[0,2,5,7,4,3,1,1]}; // scores 1..7, 8+
const norm = s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ===================== pure-ish logic ===================== */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const utcDay = ()=>new Date().toISOString().slice(0,10);
const dayNum = d=>[...d].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);
function newPuzzle(salt){
  const r=rng(dayNum(utcDay())+salt*7919);
  return {answer:ARTCARDS[Math.floor(r()*ARTCARDS.length)], px:r(), py:r(), guesses:[]}; // point seeded by date(+salt for reroll)
}
// scale after k wrong guesses; start scale S0, reaches 1 at k==steps
function scaleAt(k,steps,ease,S0=7){
  const t=Math.min(k/steps,1);
  if(ease==='lin')return S0+(1-S0)*t;
  if(ease==='geo')return Math.pow(S0,1-t);
  if(ease==='out'){return S0+(1-S0)*(1-Math.pow(1-t,2))} // big jumps first
  return 1;
}
function suggestions(q,guesses){
  q=norm(q.trim()); if(!q)return [];
  const used=new Set(guesses.map(g=>g.name));
  return CARDS.filter(c=>!used.has(c.name)&&norm(c.name).includes(q)).slice(0,8);
}
function shareText(p,won){
  const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  const wrong=p.guesses.length-1;
  return `Domindle Art · ${d} ${'🟥'.repeat(wrong)}🟩 ${p.guesses.length} guess${p.guesses.length>1?'es':''}`;
}

/* ===================== app state ===================== */
const qs=new URLSearchParams(location.search);
const cfg={variant:qs.get('variant')||'E', steps:+qs.get('steps')||9, ease:qs.get('ease')||'geo', salt:0};
let P=newPuzzle(cfg.salt), stats=structuredClone(FAKE_STATS), statsCounted=false;
let sugg=[], hl=0, modal=false, copied=false;
const won=()=>P.guesses.some(g=>g.name===P.answer.name);
const wrongs=()=>P.guesses.filter(g=>g.name!==P.answer.name);
const YESTERDAY='Sentry';

function guess(card){
  if(won()||P.guesses.some(g=>g.name===card.name))return;
  P.guesses.push(card); sugg=[]; hl=0;
  if(won()&&!statsCounted){statsCounted=true;const s=P.guesses.length;stats.played++;stats.streak++;stats.best=Math.max(stats.best,stats.streak);stats.hist[Math.min(s,8)-1]++;}
  render(true);
}
function reroll(){cfg.salt++;P=newPuzzle(cfg.salt);statsCounted=false;stats=structuredClone(FAKE_STATS);sugg=[];render();}

/* ===================== shared bits ===================== */
function imgHTML(){
  const w=won(), s=w?1:scaleAt(wrongs().length,cfg.steps,cfg.ease);
  return `<div class="frame"><img src="${P.answer.src}" alt="" style="transform-origin:${P.px*100}% ${P.py*100}%;transform:scale(${s})"></div>`;
}
function countdown(){const n=new Date(),m=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1));const d=Math.floor((m-n)/1000);const p=x=>String(x).padStart(2,'0');return `${p(d/3600|0)}:${p((d%3600)/60|0)}:${p(d%60)}`;}
function inputHTML(btnLabel='Guess'){
  if(won())return '';
  return `<div class="row"><input id="q" autocomplete="off" placeholder="Which card is this?"><button class="btn" data-act="submit">${btnLabel}</button><div class="sugg" id="sugg"></div></div>`;
}
function suggHTML(){return sugg.map((c,i)=>`<div class="${i===hl?'hl':''}" data-card="${c.name}">${c.name}</div>`).join('');}
function wrongHTML(){return wrongs().slice().reverse().map(g=>`<span class="wrong">${g.name}</span>`).join('');}
function histHTML(){const max=Math.max(...stats.hist,1);const me=won()?Math.min(P.guesses.length,8)-1:-1;
  return `<div class="hist">${stats.hist.map((n,i)=>`<div><span style="width:22px">${i===7?'8+':i+1}</span><i class="${i===me?'me':''}" style="width:${n/max*100}%"></i>${n}</div>`).join('')}</div>`;}
function statsHTML(){const avg=stats.hist.reduce((a,n,i)=>a+n*(i+1),0)/Math.max(stats.hist.reduce((a,b)=>a+b,0),1);
  return `<div class="stat"><div><b>${stats.played}</b>Played</div><div><b>${stats.streak}</b>Streak</div><div><b>${stats.best}</b>Best</div><div><b>${avg.toFixed(1)}</b>Avg score</div></div>${histHTML()}`;}
function winHTML(){return `<div class="win"><div>🎉 Solved in <b>${P.guesses.length}</b> guess${P.guesses.length>1?'es':''}</div><h2>${P.answer.name}</h2><button class="btn" style="padding:10px 18px" data-act="share">${copied?'Copied!':'Share'}</button></div>`;}
function footHTML(){return `Yesterday's answer: <b>${YESTERDAY}</b> · Next puzzle in <span class="cd">${countdown()}</span>`;}

function parch(c){
  const modalHTML=modal?`<div class="modal" data-act="modal"><div data-stop><h3 style="margin:0 0 6px">Your chronicle</h3>${statsHTML()}<button class="btn" style="padding:10px;width:100%;margin-top:10px" data-act="modal">Close</button></div></div>`:'';
  return `<div class="${c} P"><div class="wrap">
   <header><h1>Domindle <small>Art</small></h1><button class="ic" data-act="modal">📊 Stats</button></header>
   <div class="card">${imgHTML()}<div class="banner">${won()?P.answer.name:`Guess ${P.guesses.length+1}`}</div>
   <div style="margin-top:12px">${won()?winHTML():inputHTML('Guess')}${wrongHTML()}</div></div>
   <div class="meta"><span>${footHTML()}</span></div>${modalHTML}
 </div></div>`;
}
/* ===================== variants ===================== */
const VARIANTS={
 A:{name:'Parchment (Dominion-flavoured)',html:()=>parch('A')},
 D:{name:'Flat paper (lighter parchment, sans)',html:()=>parch('D')},
 E:{name:'Card frame (dark table, art as a real card)',html:()=>parch('E')},
 B:{name:'Clean (loldle-style, dark)',html:()=>`<div class="B"><div class="wrap">
   <header><h1>Domindle <span style="opacity:.5;font-weight:400">Art</span></h1><button class="ic" data-act="modal">📊 Stats</button></header>
   ${imgHTML()}
   <div class="dots">${Array.from({length:cfg.steps},(_,i)=>`<i class="${i<wrongs().length?'on':''}"></i>`).join('')}</div>
   ${won()?winHTML():inputHTML('→')}${wrongHTML()}
   <div class="foot">${footHTML()}</div>
   ${modal?`<div class="modal" data-act="modal"><div data-stop><h3 style="margin:0">Statistics</h3>${statsHTML()}<button class="btn" style="padding:10px;width:100%" data-act="modal">Close</button></div></div>`:''}
 </div></div>`},
 C:{name:'Split (image left, info right)',html:()=>`<div class="C"><div class="grid">
   <div><h1>Domindle · Art</h1>${imgHTML()}${won()?`<div class="panel" style="margin-top:12px">${winHTML()}</div>`:''}</div>
   <div>
     ${won()?'':`<div class="panel">${inputHTML('Guess')}${wrongHTML()}<div style="margin-top:10px"><small>Zoom ladder (${wrongs().length}/${cfg.steps} wrong guesses to full image)</small>
       <div class="ladder">${Array.from({length:cfg.steps},(_,i)=>`<i class="${i<wrongs().length?'on':''}" style="height:${30+i*10}%"></i>`).join('')}</div></div></div>`}
     <div class="panel"><small>${footHTML()}</small></div>
     <div class="panel">${statsHTML()}</div>
   </div></div></div>`}
};

/* ===================== render + wiring ===================== */
function render(){
  const v=VARIANTS[cfg.variant]||VARIANTS.E;
  document.getElementById('app').innerHTML=v.html();
  const q=document.getElementById('q'); if(q&&!matchMedia('(pointer:coarse)').matches)q.focus();
  document.getElementById('sugg')&&(document.getElementById('sugg').innerHTML=suggHTML());
  bar();
}
function bar(){
  const keys=Object.keys(VARIANTS);
  document.getElementById('bar').innerHTML=
   `<button data-act="prev">←</button><b>${cfg.variant} (${VARIANTS[cfg.variant].name})</b><button data-act="next">→</button>
    steps <select data-cfg="steps">${[5,6,7,8,9,10].map(n=>`<option ${n==cfg.steps?'selected':''}>${n}</option>`).join('')}</select>
    zoom <select data-cfg="ease">${[['geo','even (geometric)'],['lin','linear'],['out','big jumps first']].map(([k,l])=>`<option value="${k}" ${k==cfg.ease?'selected':''}>${l}</option>`).join('')}</select>
    <button data-act="reroll">New puzzle</button><button data-act="solve">Skip → win</button>`;
}
function setVariant(k){cfg.variant=k;const u=new URL(location);u.searchParams.set('variant',k);history.replaceState(null,'',u);modal=false;render();}
function cycle(d){const k=Object.keys(VARIANTS);setVariant(k[(k.indexOf(cfg.variant)+d+k.length)%k.length]);}

document.addEventListener('input',e=>{if(e.target.id!=='q')return;sugg=suggestions(e.target.value,P.guesses);hl=0;document.getElementById('sugg').innerHTML=suggHTML();});
document.addEventListener('keydown',e=>{
  const typing=e.target.matches('input,textarea,[contenteditable]');
  if(e.target.id==='q'){
    if(e.key==='ArrowDown'){hl=Math.min(hl+1,sugg.length-1);document.getElementById('sugg').innerHTML=suggHTML();e.preventDefault();}
    if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);document.getElementById('sugg').innerHTML=suggHTML();e.preventDefault();}
    if(e.key==='Enter'&&sugg[hl])guess(sugg[hl]);
    return;
  }
  if(typing)return;
  if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1);
});
document.addEventListener('mousedown',e=>{ // mousedown so it beats input blur
  const c=e.target.closest('[data-card]'); if(c){e.preventDefault();guess(CARDS.find(x=>x.name===c.dataset.card));}
});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  const a=e.target.closest('[data-act]'); if(!a)return;
  switch(a.dataset.act){
    case 'prev':cycle(-1);break; case 'next':cycle(1);break;
    case 'submit':if(sugg[hl])guess(sugg[hl]);break;
    case 'modal':modal=!modal;render();break;
    case 'reroll':reroll();break;
    case 'solve':guess(P.answer);break;
    case 'share':navigator.clipboard?.writeText(shareText(P)).catch(()=>{});copied=true;render();setTimeout(()=>{copied=false;render()},1500);console.log(shareText(P));break;
  }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.cfg; if(!k)return;
  cfg[k]=k==='steps'?+e.target.value:e.target.value; render();
});
setInterval(()=>document.querySelectorAll('.cd').forEach(n=>n.textContent=countdown()),1000);
render();
</script>
</body>
</html>
